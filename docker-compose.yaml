services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: ${MC_CONTAINER_NAME:-mmc3-server}
    tty: true
    stdin_open: true
    ports:
      - "${MC_SERVER_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "${MC_FABRIC_LOADER_VERSION:-}"
      INIT_MEMORY: "2G"
      MEMORY: "${MC_MEMORY:-8G}"
      JVM_OPTS: "${MC_JVM_OPTS:--XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-false}"
      PVP: "false"
      MAX_TICK_TIME: "-1"
      IGNORE_MOD_FILE_EXTENSIONS: ".jar.disabled"
      GAMERULE_KEEP_INVENTORY: "true"
      GAMERULE_PLAYERS_SLEEPING_PERCENTAGE: "1"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-mmc3_secret}"
      RCON_PORT: 25575
    volumes:
      - ./data-mmc3:/data
    restart: unless-stopped
