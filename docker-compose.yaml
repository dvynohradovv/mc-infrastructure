services:
  mc:
    image: itzg/minecraft-server:java8
    container_name: ${MC_CONTAINER_NAME:-rlcraft-server}
    tty: true
    stdin_open: true
    ports:
      - "${MC_SERVER_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.12.2"
      FORGE_VERSION: "14.23.5.2860"
      MEMORY: "${MC_MEMORY:-8G}"
      JVM_OPTS: "${MC_JVM_OPTS:--XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-false}"
      PVP: "false"
      MAX_TICK_TIME: "-1"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-rlcraft_secret}"
      RCON_PORT: 25575
    volumes:
      - ./data:/data
    restart: unless-stopped
