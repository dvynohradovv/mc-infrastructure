services:
  mc:
    image: itzg/minecraft-server:java17
    container_name: ${MC_CONTAINER_NAME:-astral-server}
    tty: true
    stdin_open: true
    ports:
      - "${MC_SERVER_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "1.18.2"
      FABRIC_LOADER_VERSION: "${MC_FABRIC_LOADER_VERSION:-}"
      INIT_MEMORY: "${MC_INIT_MEMORY:-2G}"
      MEMORY: "${MC_MEMORY:-6G}"
      JVM_OPTS: "${MC_JVM_OPTS:--XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-false}"
      PVP: "${MC_PVP:-false}"
      MAX_TICK_TIME: "-1"
      ALLOW_FLIGHT: "true"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-3}"
      VIEW_DISTANCE: "${MC_VIEW_DISTANCE:-8}"
      SIMULATION_DISTANCE: "${MC_SIMULATION_DISTANCE:-6}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:-astral_secret}"
      RCON_PORT: 25575
    volumes:
      - ./data-astral:/data
    restart: unless-stopped
